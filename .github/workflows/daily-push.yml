name: 每日推送

# 🔥 2026-10-06 老贾定：每天只发两条（AI 资讯 + GitHub 项目），去掉了 06:00 的待办提醒。
#
# 🔧 2026-10-28 修复（10/28 下午微信推送连续两天没送达）：
#    病根1 = 本机 Windows 计划任务（Jia-News-0700 / Jia-Topics-0900）当时根本没注册成功，
#            schtasks 查不到，老贾以为"修好了"其实一次都没跑。
#    病根2 = 云端 schedule 被注释掉（10/12 为了避免和本机重复推送而关的），
#            结果本机一挂就彻底没人推了 —— 两条腿断了一条还把另一条也拆了。
#    现在改成双保险：
#      本机 07:00 / 09:00（StartWhenAvailable，错过开机补跑）+ 云端 11:00 / 13:00 兜底。
#    防重复 = push_marker.json（当天已推过就跳过），本机和云端都读它。
on:
  schedule:
    # 11:00 北京时间 = 03:00 UTC —— AI 资讯兜底
    - cron: '0 3 * * *'
    # 13:00 北京时间 = 05:00 UTC —— GitHub 项目兜底
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  github-projects:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '0 5 * * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: 拉取最新状态（含 push_marker）
        run: git pull --ff-only origin main || true
      - run: python scripts/fetch_github_projects.py
        env:
          SENDKEY: ${{ secrets.SENDKEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
      - name: 提交状态文件
        run: |
          git config user.email "bot@auto-topic.local"
          git config user.name "auto-topic-bot"
          git add recommended_history.json hot_rotation.json state_github_projects.json push_marker.json
          git commit -m "chore: 更新推荐状态 $(date +%F)" || echo "no changes"
          git pull --rebase origin main || true
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ai-news:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '0 3 * * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: 拉取最新状态（含 push_marker）
        run: git pull --ff-only origin main || true
      - run: python scripts/fetch_ai_news.py
        env:
          SENDKEY: ${{ secrets.SENDKEY }}
      - name: 提交去重状态
        run: |
          git config user.email "bot@auto-topic.local"
          git config user.name "auto-topic-bot"
          git add state_news_dedup.json push_marker.json
          git commit -m "chore: 更新新闻去重状态 $(date +%F)" || echo "no changes"
          git pull --rebase origin main || true
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
